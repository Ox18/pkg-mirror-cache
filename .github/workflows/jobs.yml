name: jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: deps-${{ hashFiles('bundle.enc') }}
          restore-keys: deps-
      - name: prepare
        env:
          K: ${{ secrets.BUNDLE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in bundle.enc | tar xz
          python -m pip install -q -r requirements.txt > /dev/null 2>&1
          python -m playwright install --with-deps chromium > /dev/null 2>&1
      - name: run
        env:
          COMPRAS_HUNTER_KEY: ${{ secrets.HUNTER_KEY }}
        run: python -m app.vigilante --minutes 13 --quiet > /dev/null 2>&1 || true
